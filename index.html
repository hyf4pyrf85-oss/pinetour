<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinetour</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="pinetour">
      <div class="container">
        <div class="navigation">
          <img class="logo-img" src="./logo 1.png" />
          <div class="menu">
            <p>Home</p>
            <p>Contact</p>
            <p>About</p>
            <img class="user-img" src="./user.png" />
          </div>
          <div class="en">EN</div>
        </div>
        <h1 class="magic">PURE MAGIC</h1>
        <h1 class="awaits">AWAITS</h1>
        <h1 class="year">2024</h1>
      </div>
      <div class="images-container">
        <div class="lake">TERKHIIN TSAGAAN LAKE</div>
        <div class="lake">AMARBAYARSGALANT MONASTERY</div>
        <div class="lake">KHUVSGUL LAKE</div>
        <div class="lake">KHORGIIN TOGOO</div>
      </div>
      <div class="roadmap">
        <p class="roadmap-title">Destination of Our Agency</p>
        <p class="roadmap-subtitle">Pack your bags and get ready</p>
        <div class="roadmap-box">
          <div class="location-box">
            <div class="location-child">
              <img class="circle-1" src="./11111.png" alt="" />
            </div>
            <div class="location-child">
              <img class="circle-2" src="./Frame 176.png" />
            </div>
            <div class="location-child">
              <img class="circle-3" src="./Frame 177.png" />
            </div>
            <div class="location-child">
              <img class="circle-4" src="./Frame 178.png" />
            </div>
            <div class="location-child">
              <img class="circle-5" src="./Frame 179.png" />
            </div>
          </div>
        </div>
      </div>
      <div class="price-footer">
        <div class="price-1"></div>
        <div class="price-2"></div>
        <div class="price-3"></div>
      </div>
    </div>
  </body>
</html>
